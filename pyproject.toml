[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "intelligent-route-optimization"
version = "1.0.0"
description = "Ant Colony Optimization solver for coordinate-based TSP datasets"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.8,<4",
]
keywords = ["aco", "optimization", "python", "routing", "tsp"]

[project.scripts]
intelligent-route = "intelligent_route_optimization.solver:main"

[tool.setuptools.packages.find]
include = ["intelligent_route_optimization*"]
